name: Build and Release

on:
  push:
    branches:
      - "26.4-snapshot"
      - "26.3-NeoForge"
      - "26.3-Fabric"
      - "26.2-Fabric"
      - "1.21.11-Fabric"
      - "1.21.1-Fabric"
    tags:
      - 'v*'
  pull_request:
    branches:
      - "26.4-snapshot"
      - "26.3-NeoForge"
      - "26.3-Fabric"
      - "26.2-Fabric"
      - "1.21.11-Fabric"
      - "1.21.1-Fabric"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (For 26.x branches)
        if: contains(github.ref, '26.')
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up JDK 21 (For 1.21.x branches)
        if: contains(github.ref, '1.21.')
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew build --no-daemon

      - name: Collect jars
        run: |
          mkdir -p dist
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar|*-javadoc.jar) continue ;;
            esac
            cp "$f" dist/
          done
          echo "将要处理的文件:"
          ls -l dist

      - name: Upload Artifact for Testing
        uses: actions/upload-artifact@v4
        with:
          name: GameInfo-Test-Build
          path: dist/*.jar
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') 
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          name: ${{ github.ref_name }}
          generate_release_notes: true
