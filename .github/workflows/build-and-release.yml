name: Build and Release

on:
  push:
    branches:
      - "26.4-snapshot"
      - "26.3-NeoForge"
      - "26.3-Fabric"
      - "26.2-Fabric"
      - "1.21.11-Fabric"
      - "1.21.1-Fabric"
    tags:
      - 'v*'   # 只有推送 v 开头的 Tag 时，才会触发发布
  pull_request:
    branches:
      - "26.4-snapshot"
      - "26.3-NeoForge"
      - "26.3-Fabric"
      - "26.2-Fabric"
      - "1.21.11-Fabric"
      - "1.21.1-Fabric"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 1. 智能判断 Java 版本
      # ==========================================
      - name: Set up JDK 25 (For 26.x branches)
        if: contains(github.ref, '26.')
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up JDK 21 (For 1.21.x branches)
        if: contains(github.ref, '1.21.')
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # 注意：如果你的 1.21.1 分支需要 JDK 17，请把上面的 '21' 改成 '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ==========================================
      # 2. 构建与测试
      # ==========================================
      - name: Build & Test
        run: ./gradlew build --no-daemon

      - name: Collect jars
        run: |
          mkdir -p dist
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar|*-javadoc.jar) continue ;;
            esac
            cp "$f" dist/
          done
          echo "将要处理的文件:"
          ls -l dist

      # ==========================================
      # 3. 日常测试：上传 Actions 附件供下载
      # ==========================================
      - name: Upload Artifact for Testing
        uses: actions/upload-artifact@v4
        with:
          name: GameInfo-Test-Build
          path: dist/*.jar
          retention-days: 7

      # ==========================================
      # 4. 正式发布：打 Tag 时推送至 GitHub 和 Modrinth
      # ==========================================
      - name: Publish to GitHub & Modrinth
        if: startsWith(github.ref, 'refs/tags/v')
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # --- GitHub Release 配置 ---
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: true
          name: GameInfo ${{ github.ref_name }}

          # --- Modrinth 配置 ---
          modrinth-id: evkHqczD
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          # --- 文件与版本信息 ---
          files: dist/*.jar
          version: ${{ github.ref_name }}
          version-type: release # 可选：release, beta, alpha
          
          # 1. 加载器：如果是 NeoForge 分支，请改成 neoforge
          loaders: fabric
          
          # 2. 游戏版本：写当前分支支持的游戏版本，会自动在网页上打版本标签
          game-versions: |
            26.2
            
          # 3. Java 版本：1.21 分支记得改成 21 或 17
          java: 25 
