name: Build and Release

on:
  push:
    branches:
      - "26.4-snapshot"
      - "26.3-NeoForge"
      - "26.3-Fabric"
      - "26.2-Fabric"
      - "1.21.11-Fabric"
      - "1.21.1-Fabric"
    tags:
      - 'v*'
  pull_request:
    branches:
      - "26.4-snapshot"
      - "26.3-NeoForge"
      - "26.3-Fabric"
      - "26.2-Fabric"
      - "1.21.11-Fabric"
      - "1.21.1-Fabric"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (For 26.x branches)
        if: contains(github.ref, '26.')
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up JDK 21 (For 1.21.x branches)
        if: contains(github.ref, '1.21.')
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build & Test
        run: ./gradlew build --no-daemon

      - name: Collect jars
        run: |
          mkdir -p dist
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar|*-javadoc.jar) continue ;;
            esac
            cp "$f" dist/
          done
          echo "---- 将要处理的文件 ----"
          ls -l dist

      - name: Upload Artifact for Testing
        uses: actions/upload-artifact@v4
        with:
          name: GameInfo-Test-Build
          path: dist/*.jar
          retention-days: 7

      - name: Publish to GitHub & Modrinth
        if: startsWith(github.ref, 'refs/tags/v')
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-generate-changelog: true
          name: GameInfo ${{ github.ref_name }}

          modrinth-id: ${{ !contains(github.ref_name, 'alpha') && 'evkHqczD' || '' }}
          modrinth-token: ${{ !contains(github.ref_name, 'alpha') && secrets.MODRINTH_TOKEN || '' }}
          modrinth-featured: true

          files: dist/*.jar
          version: ${{ github.ref_name }}
          version-type: ${{ contains(github.ref_name, 'alpha') && 'alpha' || 'release' }}

          loaders: fabric

          game-versions: |
            1.21.11
            
          java: 21 
